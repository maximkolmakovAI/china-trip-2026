<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2A24"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="30" height="30" patternTransform="rotate(45)">
      <circle cx="15" cy="15" r="1.5" fill="#C00050" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect x="0" y="0" width="800" height="600" fill="none" stroke="#E50071" stroke-width="6"/>
  <rect x="15" y="15" width="770" height="570" fill="none" stroke="#E50071" stroke-width="1.5"/>
  <!-- Accent line -->
  <rect x="0" y="0" width="8" height="600" fill="#C00050"/>
  <!-- Top corner marker -->
  <rect x="15" y="15" width="60" height="3" fill="#C00050"/>
  <rect x="15" y="15" width="3" height="40" fill="#C00050"/>
  <!-- Hotel icon area -->
  <rect x="60" y="180" width="120" height="120" fill="none" stroke="#C00050" stroke-width="2" opacity="0.3"/>
  <rect x="70" y="190" width="100" height="100" fill="none" stroke="#C00050" stroke-width="1" opacity="0.2"/>
  <!-- Hotel name -->
  <text x="60" y="120" font-family="Impact, 'Arial Black', sans-serif" font-size="40" font-weight="900" fill="#F5F0EB" letter-spacing="2">Amanyangyun</text>
  <text x="60" y="155" font-family="'Courier New', monospace" font-size="16" fill="#F5F0EB" opacity="0.6">Пригород</text>
  <!-- Divider -->
  <rect x="60" y="370" width="680" height="1" fill="#E50071" opacity="0.4"/>
  <!-- Bottom info -->
  <text x="60" y="420" font-family="'Courier New', monospace" font-size="14" fill="#F5F0EB" opacity="0.4">HOTEL ID: SH2</text>
  <text x="60" y="450" font-family="Impact, 'Arial Black', sans-serif" font-size="28" fill="#C00050" letter-spacing="3">127 000₽</text>
  <text x="60" y="480" font-family="'Courier New', monospace" font-size="12" fill="#F5F0EB" opacity="0.25">/ night per room</text>
  <!-- Bottom right tag -->
  <text x="700" y="560" font-family="Impact, 'Arial Black', sans-serif" font-size="14" fill="#E50071" letter-spacing="4" opacity="0.5" text-anchor="end">CHINA 2026</text>
  <!-- Corner bracket -->
  <rect x="770" y="570" width="15" height="15" fill="none" stroke="#C00050" stroke-width="2"/>
</svg>